# GH actions.
# We use it to cover windows and mac builds
# Jenkins is still the primary CI

name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: CI-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  MacOS:
    if: ${{ github.repository == 'MetaX-MACA/mcTVM' }}
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: 'recursive'
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Build TVM wheel
        shell: bash -l {0}
        run: |
          pip install scikit-build-core
          export CMAKE_ARGS="-DUSE_LLVM=ON -DBUILD_TESTING=OFF"
          pip wheel --no-deps -w dist . -v
      - name: Install TVM from wheel
        shell: bash -l {0}
        run: |
          pip install dist/*.whl

      - name: Test
        shell: bash -l {0}
        run: >-
          python -m pytest -v tests/python/all-platform-minimal-test
      - name: Minimal Metal Compile-Only
        shell: bash -l {0}
        run: |
          python -m pytest -v -s 'tests/python/codegen/test_gpu_codegen_allreduce.py::test_allreduce_sum_compile'
          python -m pytest -v -s 'tests/python/codegen/test_target_codegen_metal.py::test_func_with_trailing_pod_params'
      - name: Minimal Metal Compile-and-Run
        shell: bash -l {0}
        run: >-
          python -m pytest -v -s 'tests/python/codegen/test_target_codegen_metal.py'
          python -m pytest -v -s 'tests/python/codegen/test_target_codegen_gpu_common.py'
          python -m pytest -v -s 'tests/python/codegen/test_gpu_codegen_allreduce.py::test_allreduce_sum[dims0-metal]'

  Windows:
    if: ${{ github.repository == 'MetaX-MACA/mcTVM' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: 'recursive'
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.4
      - name: sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ runner.os }}-sccache-tvm-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-tvm-
      - name: Install TVM
        shell: cmd /C call {0}
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
          CMAKE_GENERATOR: Ninja
        run: |
          pip install scikit-build-core
          sccache --start-server
          set CMAKE_ARGS=-DUSE_LLVM=ON -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          pip install --no-deps . -v
          sccache --show-stats
          sccache --stop-server
      - name: Install test dependencies
        shell: cmd /C call {0}
        run: |
          pip install psutil cloudpickle ml_dtypes numpy packaging scipy tornado typing_extensions
      - name: Test
        shell: cmd /C call {0}
        run: >-
          python -m pytest -v tests/python/all-platform-minimal-test

  MetaXGPU:
    if: ${{ github.repository == 'MetaX-MACA/mcTVM' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: 'recursive'

      - name: Build
        run: |
          rm -rf build
          mkdir -p build
          cp cmake/config.cmake build
          echo "set(USE_LLVM ON)" >> build/config.cmake
          echo "set(USE_MCBLAS ON)" >> build/config.cmake
          echo "set(USE_MCDNN ON)" >> build/config.cmake
          cmake -B build
          make -j $(nproc) -C build

      - name: Setup pytest environment
        run: |
          echo "TVM_TEST_TARGETS=maca" | tee -a "${GITHUB_ENV}"
          echo "TVM_UNITTEST_TESTSUITE_NAME=python-unittest-gpu" | tee -a "${GITHUB_ENV}"
          echo "PLATFORM=gpu" | tee -a "${GITHUB_ENV}"
          set -euxo pipefail
          rm -rf build/pytest-results
          find . -type f -path "*.pyc" | xargs rm -f
          pip install -v --target=python ./3rdparty/tvm-ffi/

      - name: Run 'minimal' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest python-platform-gpu-minimal-test, tests/python/all-platform-minimal-test -n 4

      - name: Run 'ffi' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest ffi, tests/python/ffi -n 4

      - name: Run 'arith' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest arith, tests/python/arith -n 4

      - name: Run 'ci' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest ci, tests/python/ci -n 4

      - name: Run 'codegen' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest codegen, tests/python/codegen -n 4

      - name: Run 'driver' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest driver, tests/python/driver -n 4

      - name: Run 'ir' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest ir, tests/python/ir -n 4

      - name: Run 'meta_schedule' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest meta_schedule, tests/python/meta_schedule -n 4

      - name: Run 'runtime' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest runtime, tests/python/runtime -n 4

      - name: Run 'target' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest target, tests/python/target -n 4

      - name: Run 'te' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest te, tests/python/te -n 4

      - name: Run 'testing' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest testing, tests/python/testing -n 4

      - name: Run 's_tir/base' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest s_tir/base, tests/python/s_tir/base -n 4

      - name: Run 's_tir/schedule' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest s_tir/schedule, tests/python/s_tir/schedule -n 4

      - name: Run 's_tir/dlight' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest s_tir/dlight, tests/python/s_tir/dlight -n 4

      - name: Run 's_tir/analysis' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest s_tir/analysis, tests/python/s_tir/analysis -n 4

      - name: Run 's_tir/transform' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest s_tir/transform, tests/python/s_tir/transform -n 4

      - name: Run 'tirx-analysis' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest tirx-analysis, tests/python/tirx-analysis -n 4

      - name: Run 'tirx-base' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest tirx-base, tests/python/tirx-base -n 4

      - name: Run 'tirx-transform' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest tirx-transform, tests/python/tirx-transform -n 4

      - name: Run 'tirx' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest tirx, tests/python/tirx -n 4

      - name: Run 'tvmscript' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest tvmscript, tests/python/tvmscript -n 4

      - name: Run 'relax' unittests
        run: |
          set -euxo pipefail
          source tests/scripts/setup-pytest-env.sh
          run_pytest relax, tests/python/relax -n 4

      - name: Test Summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: "build/pytest-results/**/*.xml"
          output: test-summary.md

      - name: Upload test summary
        if: ${{ always() && hashFiles('test-summary.md') != '' }}
        run: cat test-summary.md >> "$GITHUB_STEP_SUMMARY"

  Linux_CPU_Test:
    if: ${{ false && github.repository == 'MetaX-MACA/mcTVM' }}
    runs-on: ubuntu-latest
    env:
      PLATFORM: cpu
      DOCKER_RUN: docker/bash.sh --env PLATFORM --env SKIP_SLOW_TESTS --env TEST_STEP_NAME
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: 'recursive'
      - name: Pull Image
        shell: bash -l {0}
        run: >-
          python ./ci/scripts/jenkins/determine_docker_images.py ci_cpu &&
          image=$(cat .docker-image-names/ci_cpu) &&
          docker pull $image &&
          echo "IMAGE=$image" >> $GITHUB_ENV
      - name: Build
        shell: bash -l {0}
        run: >-
          $DOCKER_RUN $IMAGE ./tests/scripts/task_config_build_cpu.sh build &&
          echo "set(USE_MACA OFF)" >> build/config.cmake &&
          $DOCKER_RUN $IMAGE tests/scripts/task_build.py  --build-dir build &&
          $DOCKER_RUN $IMAGE ./tests/scripts/task_build.py  --build-dir build --cmake-target cpptest
      - name: Run CPP unit test
        shell: bash -l {0}
        run: >-
          $DOCKER_RUN $IMAGE ./tests/scripts/task_cpp_unittest.sh
        env:
          TEST_STEP_NAME: "CPU unittest: cpptest"
      - name: Run Python unit test
        shell: bash -l {0}
        run: >-
          $DOCKER_RUN $IMAGE ./tests/scripts/task_python_unittest.sh
        env:
          TEST_STEP_NAME: "CPU unittest: python"
